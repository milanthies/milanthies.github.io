# --- Journal articles -------------------------------------------------------

- title: "State Intervention in Vocational Education: Training for the Digital and Green Transitions"
  year: 2025
  type: article
  venue: "Regulation & Governance"
  theme: state
  selected: true
  summary: >-
    Have states become more central to skill formation? Topic models applied to 291
    standardised descriptions of national training systems show that language associated
    with state involvement grew, relative to private governance, in most EU member states
    between 2005 and 2022. A case study of Germany, a least likely case, draws on 32 elite
    interviews to show how digitalisation and climate change opened a window for
    redefining the role of the state in vocational training.
  links:
    - label: "Article (open access)"
      url: "https://doi.org/10.1111/rego.70074"
    - label: "Repository copy"
      url: "https://hdl.handle.net/1814/93734"

- title: "The Polysemy of Skills: Exploring Country-Specific Approaches in the Knowledge Economy"
  authors: "Marina Cino Pagliarello, Milan Thies, Tamara Tubakovic and Douglas Nunes"
  year: 2025
  type: article
  venue: "Regulation & Governance"
  theme: eu
  selected: true
  summary: >-
    How can the EU coordinate skills policy across very different member states? We
    analyse the national plans with which Germany, France, Sweden and Spain implement the
    Osnabrück Declaration on vocational training. Each country reads "skills" through its
    own priorities, which allows member states to align with EU objectives without
    converging on a single model.
  links:
    - label: "Article (open access)"
      url: "https://doi.org/10.1111/rego.70102"
    - label: "Repository copy"
      url: "https://hdl.handle.net/1814/93913"

- title: "Conviction or Consent? Tracing the Influence of Coalition Partners on Family Policy under Centre-Right Ministers"
  authors: "Manuel Alvariño and Milan Thies"
  year: 2024
  type: article
  venue: "Government and Opposition"
  theme: government
  selected: true
  summary: >-
    Why do centre-right governments adopt progressive family policies? Tracing parental
    leave reforms under centre-right ministers in Germany and Spain, we find that coalition
    and support parties designed the reforms and secured their adoption through three
    mechanisms: agreements for government formation, conditions for the government's
    survival and continuity in the bureaucracy.
  links:
    - label: "Article (open access)"
      url: "https://doi.org/10.1017/gov.2024.25"
    - label: "Summary on the WellSIRE blog"
      url: "https://sites.eui.eu/wellsire/blog/coalition-partners-and-social-investment-family-policy-new-wellsire-article-in-government-and-opposition"

