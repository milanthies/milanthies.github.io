#
# To add a paper: copy an existing entry (from "- title:" down to the last
# link), paste it above, and change the text between the quotes.
#
# Fields
#   title     in quotes
#   (In titles, venues and status lines, *asterisks* give italics.)
#   authors   all authors in order, in quotes. Your own name is set in bold
#             automatically. Leave out for single-authored work.
#   with      alternative to "authors": co-authors only, shown as "With ..."
#   year      year of publication (leave out for unpublished work)
#   type      article | chapter | review | thesis | report
#             ("report" = policy publications, shown on the Policy page;
#             "review" = book reviews, listed on the CV page only)
#   venue     journal, book or publisher, in quotes
#   details   optional: volume, issue, pages
#   status    ONLY for unpublished work, e.g. "Working paper" or
#             "Revise and resubmit, Journal of X". Anything with a status is
#             listed under "Work in progress". Delete the line once published.
#   theme     state | adult | eu | government  (see research.yml); optional
#   selected  true = also shown on the home page
#   summary   two or three plain sentences about the paper
#   abstract  optional: the full abstract; shown behind an "Abstract" toggle
#   note      optional: a short remark, e.g. your role in a report
#   lang      optional: "de" or "fr" if the title is not in English
#   links     label + url pairs, as many as you like
