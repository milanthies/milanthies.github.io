roles:
  - when: "Since 2026"
    title: "Member of the Advisory Council, National Service Point for Adult Education Agencies"
    org: "Appointed by the German Federal Ministry of Labour and Social Affairs"
    text: >-
      The service point (Servicestelle Weiterbildungsagenturen) supports regional
      networks in building up adult education agencies, which act as contact points
      for guidance on continuing training. It is an initiative of the ministry and is
      run by the Federal Institute for Vocational Education and Training (BIBB).

experience:
  - when: "2019–2020"
    title: "Policy analyst, Department for Digitalisation and the World of Work"
    org: "German Federal Ministry of Labour and Social Affairs, Berlin"
    text: >-
      During Germany's Presidency of the Council of the EU in 2020, I helped to
      coordinate the ministry's work on EU employment policy and was an editor of its
      Thematic Reader for the Presidency. I also worked with the Franco-German expert
      group on the future of work.

  - when: "2018–2019"
    title: "Head of office and policy advisor to Karin Halsch, Member of Parliament"
    org: "Berlin House of Representatives"
