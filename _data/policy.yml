# ---------------------------------------------------------------------------
# Policy page: current roles and earlier work in government.
# Policy publications come from publications.yml (type: report) and policy
# talks from talks.yml (audience: policy), so they are not repeated here.
#
#   when   period, in quotes
#   title  role
#   org    organisation
#   text   optional: one or two sentences (Markdown allowed)
